services:
  mediarium:
    image: ghcr.io/rdborg/mediarium:3.0.0
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      # Runtipi's media folder is mounted once as /data, so downloads and the
      # library share one mount and finished downloads are hardlinked.
      - DOWNLOADS_DIR=/data/downloads/mediarium
      - MOVIES_DIR=/data/movies
      - TV_DIR=/data/tv
      # Optional folders: MUSIC_DIR, EBOOKS_DIR and AUDIOBOOKS_DIR (for example /data/music).
      # Leave them out if you do not use music, ebooks or audiobooks. See docs/INSTALL.md.
      # Optional: the permissions new files get, for example 022 or 002. Empty keeps the default.
      - UMASK=
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${RUNTIPI_MEDIA_DIR}:/data
    ports:
      # Optional torrent port; the web port is mapped by Runtipi.
      - 58264:58264/tcp
      - 58264:58264/udp
    x-runtipi:
      is_main: true
      internal_port: 8264

x-runtipi:
  schema_version: 2
