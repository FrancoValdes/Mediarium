---
# Toloka.to, the Ukrainian torrent tracker. Shipped with Mediarium because
# the shared definition list doesn't have it (Prowlarr runs it from its own
# code). Toloka's titles carry the Ukrainian name, the original name, the
# year and "Сезон 1, Серії 1-10 з 12" style episode markers; the title
# filters below turn that into a release name the parser understands.
id: toloka
name: Toloka.to
description: "Toloka is a Semi-Private Ukrainian torrent site with a thriving file-sharing community"
language: uk-UA
type: semi-private
encoding: UTF-8
links:
  - https://toloka.to/

