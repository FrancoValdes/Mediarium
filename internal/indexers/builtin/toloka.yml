  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false

login:
  path: login.php
  method: post
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    autologin: "on"
    ssl: "on"
    redirect: ""
    login: "Вхід"
  error:
    - selector: table.forumline table span.gen
  test:
    path: index.php
    selector: a[href*="logout=true"]

search:
  paths:
    - path: tracker.php
  # The site's titles say "Сезон 1, Серії 3", not S01E03, so the episode
  # part of a search is left off; the parser picks the episode afterwards.
  keywordsfilters:
    - name: re_replace
      args: ["(?i)\\bS\\d{1,3}(E\\d{1,4})?\\b", ""]
    - name: re_replace
      args: ["-", " "]
    - name: trim
  inputs:
    $raw: "{{ range .Categories }}f[]={{.}}&{{end}}"
    o: 1
    s: 2
    nm: "{{ .Keywords }}"
    sds: "{{ if .Config.freeleech }}1{{ else }}{{ end }}"
  rows:
    selector: table.forumline > tbody > tr[class*="prow"]
  fields:
    category:
      selector: td:nth-child(2) > a
      attribute: href
      filters:
        - name: querystring
          args: f
    title:
      selector: td:nth-child(3) > a
      filters:
        # every kind of dash becomes a hyphen
        - name: re_replace
          args: ["\\p{Pd}", "-"]
        - name: re_replace
          args: ["\\s(\\d+),(\\d+)", " $1-$2"]
        # Ukrainian season and episode markers, as the parser writes them
        - name: re_replace
          args: ["(?i)(?:Сезони?|Seasons?)\\s*:?\\s+(\\d+)-(\\d+)", "S$1-S$2"]
        - name: re_replace
          args: ["(?i)Сезон\\s*:?\\s+(\\d+)[^\\d]+?(?:Серії|Серія|Серій|Епізоди?)\\s*:?\\s+(\\d+)-(\\d+)(?:\\s*з\\s*[\\w?]+)?", "S$1E$2-E$3"]
        - name: re_replace
          args: ["(?i)Сезон\\s*:?\\s+(\\d+)[^\\d]+?(?:Серії|Серія|Серій|Епізоди?)\\s*:?\\s+(\\d+)(?:\\s*з\\s*[\\w?]+)?", "S$1E$2"]
        - name: re_replace
          args: ["(?i)Сезон\\s*:?\\s+(\\d+)", "S$1"]
        - name: re_replace
          args: ["(?i)Season\\s*:?\\s+(\\d+)[^\\d]+?Episodes?\\s*:?\\s+(\\d+)-(\\d+)(?:\\s*of\\s*[\\w?]+)?", "S$1E$2-E$3"]
        - name: re_replace
          args: ["(?i)Season\\s*:?\\s+(\\d+)[^\\d]+?Episodes?\\s*:?\\s+(\\d+)(?:\\s*of\\s*[\\w?]+)?", "S$1E$2"]
        - name: re_replace
          args: ["(?i)Season\\s*:?\\s+(\\d+)", "S$1"]
        # "Тиха вулиця (S2E1-E8) / Quiet Street (S2) (2023) ..." becomes
        # "Quiet Street S2E1-E8 (2023) ...": the marker from the Ukrainian
        # half goes after the English name.
        - name: re_replace
          args: ["^[^/]*?\\((S\\d+(?:-S\\d+)?(?:E\\d+(?:-E\\d+)?)?)\\)[^/]*/\\s*([^(\\[]+?)\\s*(?:\\(S\\d+(?:-S\\d+)?\\)\\s*)?([(\\[]|$)", "$2 $1 $3"]
        # otherwise the Ukrainian name before " / ", and any other Cyrillic words
        - name: re_replace
          args: ["^[^/A-Za-z]*\\p{Cyrillic}[^/A-Za-z]*/\\s*", ""]
        - name: re_replace
          args: ["\\([\\p{Cyrillic}\\W]+\\)", ""]
        - name: re_replace
          args: ["[\\p{Cyrillic}]+", ""]
        - name: re_replace
          args: ["(?i)\\b-Rip\\b", "Rip"]
        - name: re_replace
          args: ["(?i)\\bWEB-?DL-?Rip\\b", "WEB-DL"]
        - name: re_replace
          args: ["(?i)\\bHDTVRip\\b", "HDTV"]
        - name: re_replace
          args: ["[\\[(]\\s*[,/+&-]*\\s*[\\])]", ""]
        - name: re_replace
          args: ["\\s+", " "]
        - name: re_replace
          args: ["^[\\s&,.!?+_|/\\\\:;-]+|[\\s&,.!?+_|/\\\\:;-]+$", ""]
    details:
      selector: td:nth-child(3) > a
      attribute: href
    download:
      selector: td:nth-child(6) > a
      attribute: href
    size:
      selector: td:nth-child(7)
    grabs:
      selector: td:nth-child(9)
      optional: true
    seeders:
      selector: td:nth-child(10) > b
      optional: true
    leechers:
      selector: td:nth-child(11) > b
      optional: true
    date:
      selector: td:nth-child(13)
      optional: true
      filters:
        - name: fuzzytime
    downloadvolumefactor:
      case:
        img[src="images/gold.gif"]: 0
        img[src="images/authors.gif"]: 0
        img[src="images/silver.gif"]: 0.5
        img[src="images/bronze.gif"]: 0.75
        "*": 1
    uploadvolumefactor:
      text: 1
