settings:
  - name: info_new
    type: info
    label: "New site, not tested against the live IPTorrents yet. In your IPTorrents profile, set 'Torrents per page' to 100, tick the files count option and set the category column to icons, or results can come back empty."
  - name: cookie
    type: password
    label: Cookie
  - name: info_cookie
    type: info_cookie
  - name: useragent
    type: text
    label: User-Agent
  - name: info_useragent
    type: info_useragent
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort results by
    default: time
    options:
      time: Newest first
      seeders: Seeders
      leechers: Leechers
      completed: Snatches
      size: Size
      name: Name

# There is no login form to fill in: the cookie from the browser is the
# login. The check looks for the sign-out link on the front page.
login:
  method: cookie
  test:
    path: /
    # signed in: the sign-out link (its address has been /lout.php), or the
    # "Log out" tooltip of its icon (not always inside a link), or the torrents
    # table that only a signed-in page has. The front page may also send a
    # signed-in member on to the torrents page.
    selector: 'a[href*="lout.php"], a[href*="logout"], a[href*="signout"], .tTip:contains("Log out"), a:contains("Log out"), a:contains("Logout"), a:contains("Sign out"), table#torrents'

search:
  paths:
    - path: t
  keywordsfilters:
    # the site's search treats - ! | @ ~ ( ) " / as commands, so only words,
    # numbers and the * wildcard are sent
    - name: re_replace
      args: ["[^\\p{L}\\p{N}\\s*]", " "]
    # "Show S02" (a whole season) also finds S02E01, S02E02...
    - name: re_replace
      args: ["(?i)\\b(S\\d{1,3})\\s*$", "$1*"]
    - name: re_replace
      args: ["\\s+", " "]
    - name: trim
  inputs:
    # every wanted category is a key with no value: 72=&73=
    $raw: "{{ range .Categories }}{{ . }}=&{{ end }}"
    # all words must match
    q: "{{ if .Keywords }}+({{ .Keywords }}){{ end }}"
    free: "{{ if .Config.freeleech }}on{{ end }}"
    o: "{{ if ne .Config.sort \"time\" }}{{ .Config.sort }}{{ end }}"
  rows:
    selector: table#torrents tr:has(a.hv)
  fields:
    category:
      selector: td:nth-child(1) a[href^="?"]
      attribute: href
      filters:
        - name: regexp
          args: "(\\d+)"
    title:
      selector: a.hv
      filters:
        # request markers some uploaders add to the name
        - name: re_replace
          args: ["(?i)[\\[(]\\s*REQ(?:UEST(?:ED)?)?\\s*[\\])]", ""]
        - name: re_replace
          args: ["\\s+", " "]
        - name: trim
    details:
      selector: a.hv
      attribute: href
    download:
      selector: a[href^="/download.php/"]
      attribute: href
    size:
      selector: td:nth-child(6)
    grabs:
      selector: td:nth-last-child(3)
      optional: true
    seeders:
      selector: td:nth-last-child(2)
      optional: true
    leechers:
      selector: td:nth-last-child(1)
      optional: true
    date:
      # "Drama, Thriller | 3.2 hours ago by someone": keep the part after the
      # last bar and before " by "
      selector: div.sub
      optional: true
      filters:
        - name: re_replace
          args: ["(?s)^.*\\|", ""]
        - name: re_replace
          args: ["(?s)\\s+by\\s.*$", ""]
        - name: trim
        - name: timeago
    downloadvolumefactor:
      case:
        span.free: 0
        "*": 1
    uploadvolumefactor:
      text: 1
