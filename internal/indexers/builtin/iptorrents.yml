---
# IPTorrents, the private general tracker. Shipped with Mediarium because
# the shared definition list doesn't have it (Prowlarr and Jackett run it
# from their own code, with a browser cookie instead of a login form).
#
# Written from public descriptions of how the site's pages are laid out
# (the Jackett and Prowlarr indexer notes). It has NOT been run against the
# live site yet: a member with an account needs to try it. The notes for
# testers are in docs/indexers.md.
#
# How the pages work, as described publicly:
#   - search is  /t?<category id>=&q=<terms>&free=on&o=<sort>&p=<page>
#     (each wanted category is a key with an empty value);
#   - results are a table with id "torrents"; a result row has a title link
#     with class "hv", a "sub" div (tags | "3.2 hours ago by someone"), a
#     link to /download.php/<id>/<name>.torrent, a category icon link whose
#     href is "?<category id>", and a span with class "free" on freeleech
#     torrents;
#   - the size column is the sixth cell; snatches, seeders and leechers are
#     the last three cells (an optional files column sits before them);
#   - a signed-in page carries a sign-out link (/lout.php, shown as an icon with a "Log out" tooltip
#     that is not always inside the link); the front page sends a member on to the torrents page.
# The site only shows icons in the category column, 100 torrents per page and
# the files count column if the member sets that in the site's own profile.
id: iptorrents
name: IPTorrents
description: "New and not tested against the live site yet: if you have an IPTorrents account, please try it and tell me how it went. Private general tracker; sign in with your browser cookie."
language: en-US
type: private
encoding: UTF-8
# The first address is the main site. The others are mirrors that the site and
# the indexer projects list for when the main one is blocked or down; use the
# one that works for you.
links:
  - https://iptorrents.com/
  - https://iptorrents.me/
  - https://getcrazy.me/
  - https://findnemo.net/
  - https://beelyrics.net/
  - https://venom.global/
  - https://workisboring.net/
  - https://ipt.lol/
  - https://ipt.cool/
  - https://ipt.world/

