# Sample for tests. Fake keys, example hosts. Layout and defaults from wg-easy v15 source (wgHelper.ts): MTU 1420, preshared key always present, keepalive 0 by default, DNS 1.1.1.1 and 2606:4700:4700::1111. Hook lines are optional in wg-easy; one is included to check they are ignored.
[Interface]
PrivateKey = d2dlYXN5LXByaXYtZmFrZS1zYW1wbGUta2V5LTAwMDA=
Address = 10.8.0.2/32, fdcc:ad94:bacf:61a4::cafe:2/128
MTU = 1420
DNS = 1.1.1.1, 2606:4700:4700::1111
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

[Peer]
PublicKey = d2dlYXN5LXB1Yi1mYWtlLXNhbXBsZS1rZXktMDAwMDA=
PresharedKey = d2dlYXN5LXBzay1mYWtlLXNhbXBsZS1rZXktMDAwMDA=
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 0
Endpoint = vpn.home.example:51820
