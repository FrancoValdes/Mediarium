# Sample for tests. Fake keys, example hosts. Layout from PiVPN's makeCONF.sh: DNS line, preshared key, ::0/0 in AllowedIPs, keepalive 25 (the docs' value). Subnet 10.19.17.0/24 is the one the docs call likely.
[Interface]
PrivateKey = cGl2cG4tcHJpdi1mYWtlLXNhbXBsZS1rZXktMDAwMDA=
Address = 10.19.17.2/24
DNS = 9.9.9.9, 149.112.112.112

[Peer]
PublicKey = cGl2cG4tcHViLWZha2Utc2FtcGxlLWtleS0wMDAwMDA=
PresharedKey = cGl2cG4tcHNrLWZha2Utc2FtcGxlLWtleS0wMDAwMDA=
Endpoint = vpn.home.example:51820
AllowedIPs = 0.0.0.0/0, ::0/0
PersistentKeepalive = 25
