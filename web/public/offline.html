<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mediarium can't be reached</title>
    <style>
      :root { color-scheme: dark light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0b0d18; color: #e8eaf2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      @media (prefers-color-scheme: light) { body { background: #f6f7fb; color: #1b1e2b; } }
      main { max-width: 30rem; text-align: left; }
      h1 { font-size: 1.5rem; margin: 0 0 0.6rem; letter-spacing: -0.02em; }
      p { line-height: 1.55; margin: 0 0 0.9rem; opacity: 0.85; }
      button { font: inherit; font-weight: 600; padding: 0.6rem 1.1rem; border-radius: 10px; border: 0; background: #5eead4; color: #062a26; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="h">Mediarium can't be reached</h1>
      <p id="a">This device has no connection to your Mediarium right now. Check that it is on the same network (or that your VPN is on) and that the server is running.</p>
      <p id="b">Nothing is lost: what you were doing is still on the server.</p>
      <button type="button" id="r">Try again</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
